{% extends "base.html" %}
{% block title %}ログイン - project2{% endblock %}
{% block content %}
<div class="card">
    <h2>ログイン</h2>
    <!-- エラーメッセージの表示先。JS側でここにメッセージを差し込む -->
    <p id="error-message" class="error-message" hidden></p>

    <form id="login-form">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" required autocomplete="username">

        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">ログイン</button>
    </form>

    <p class="switch-link">
        アカウントが無い場合は <a href="/register">新規登録</a>
    </p>
</div>

<script src="/static/js/api.js?v={{ static_version('js/api.js') }}"></script>
<script src="/static/js/login.js?v={{ static_version('js/login.js') }}"></script>
{% endblock %}
